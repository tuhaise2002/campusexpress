<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vendor Access – Campus Express Food</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #c2410c; --light: #fefce8; --dark: #111827; }
    body { font-family:'Inter',sans-serif; background:var(--light); color:var(--dark); margin:0; padding:0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
    .login-box { background:white; padding:2.5rem; border-radius:0.8rem; box-shadow:0 4px 20px rgba(0,0,0,0.1); width:100%; max-width:400px; text-align:center; }
    h1 { font-family:'Poppins',sans-serif; color:var(--primary); margin-bottom:1.5rem; }
    input { width:100%; padding:0.9rem; margin:0.8rem 0; border:1px solid #d1d5db; border-radius:0.5rem; font-size:1.05rem; }
    button { width:100%; padding:1rem; background:var(--primary); color:white; border:none; border-radius:0.6rem; font-size:1.1rem; font-weight:600; cursor:pointer; }
    button:hover { background:#9a3412; }
    #error { color:#c2410c; margin-top:1rem; font-weight:500; display:none; }
    .back { margin-top:1.5rem; font-size:0.95rem; }
    .back a { color:var(--primary); text-decoration:none; }
  </style>
</head>
<body>

  <div class="login-box">
    <h1>Vendor Access</h1>
    <p>Sign in to upload your food items</p>

    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>

    <div id="error">Incorrect username or password</div>

    <div class="back">
      <a href="index.html">← Back to main page</a>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      
      // Hardcoded credentials (change these!)
      const correctUser = "vendor";
      const correctPass = "campus2026";  // ← Change to your shared code

      if (username === correctUser && password === correctPass) {
        window.location.href = "vendor-upload.html";
      } else {
        document.getElementById('error').style.display = "block";
      }
    });
  </script>

</body>
</html>
