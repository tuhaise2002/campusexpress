<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Express - My Cart</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f8f9fa;
      color: #333;
    }

    /* HEADER */
    .header {
      background: #27ae60;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .header h1 {
      color: white;
      font-size: 20px;
      flex: 1;
    }

    .back-btn {
      color: white;
      font-size: 24px;
      cursor: pointer;
      text-decoration: none;
    }

    /* CONTAINER */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
      padding-bottom: 100px;
    }

    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #777;
    }

    .empty-cart i {
      font-size: 64px;
      color: #ddd;
      margin-bottom: 16px;
    }

    .empty-cart p {
      margin-bottom: 20px;
      font-size: 16px;
    }

    .home-btn {
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .home-btn:hover {
      background: #219653;
    }

    /* CART ITEMS */
    .cart-items {
      margin-bottom: 20px;
    }

    .cart-item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item-details {
      flex: 1;
    }

    .item-name {
      font-size: 15px;
      font-weight: 600;
      color: #111;
      margin-bottom: 8px;
    }

    .item-price {
      font-size: 16px;
      font-weight: 700;
      color: #c0392b;
      margin-bottom: 8px;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }

    .qty-btn {
      background: #ecf0f1;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      color: #333;
      transition: background 0.2s;
    }

    .qty-btn:hover {
      background: #bdc3c7;
    }

    .quantity {
      min-width: 30px;
      text-align: center;
      font-weight: 600;
    }

    .item-total {
      font-size: 14px;
      color: #777;
      margin-left: 8px;
    }

    .remove-btn {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      margin-left: 12px;
      transition: background 0.2s;
    }

    .remove-btn:hover {
      background: #c0392b;
    }

    /* ORDER SUMMARY */
    .order-summary {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .summary-row.total {
      border-top: 2px solid #ecf0f1;
      padding-top: 12px;
      font-size: 18px;
      font-weight: 700;
      color: #c0392b;
    }

    /* ACTION BUTTONS */
    .actions {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .actions button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .continue-btn {
      background: #95a5a6;
      color: white;
    }

    .continue-btn:hover {
      background: #7f8c8d;
    }

    .checkout-btn {
      background: #27ae60;
      color: white;
    }

    .checkout-btn:hover {
      background: #219653;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-around;
      box-shadow: 0 -3px 12px rgba(0,0,0,0.1);
      z-index: 999;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #555;
      font-size: 10px;
      text-decoration: none;
    }

    .nav-item i {
      font-size: 28px;
      margin-bottom: 3px;
    }

    .nav-item.active {
      color: #27ae60;
    }

    @media (min-width: 768px) {
      .bottom-nav { display: none; }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <a href="index.html" class="back-btn">
      <i class='bx bx-arrow-back'></i>
    </a>
    <h1>My Cart</h1>
  </div>

  <!-- CONTAINER -->
  <div class="container">
    
    <!-- EMPTY STATE -->
    <div id="emptyCart" class="empty-cart" style="display: none;">
      <i class='bx bx-shopping-bag'></i>
      <p>Your cart is empty</p>
      <a href="index.html" class="home-btn">Continue Shopping</a>
    </div>

    <!-- CART ITEMS -->
    <div id="cartContent" style="display: none;">
      <div class="cart-items" id="cartItemsList"></div>

      <!-- ORDER SUMMARY -->
      <div class="order-summary">
        <div class="summary-row">
          <span>Subtotal:</span>
          <span id="subtotal">UGX 0</span>
        </div>
        <div class="summary-row">
          <span>Delivery Fee:</span>
          <span id="deliveryFee">UGX 0</span>
        </div>
        <div class="summary-row total">
          <span>Total:</span>
          <span id="totalPrice">UGX 0</span>
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="actions">
        <button class="continue-btn" onclick="goHome()">Continue Shopping</button>
        <button class="checkout-btn" onclick="sendOrderToWhatsApp()">Send Order</button>
      </div>
    </div>

  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class='bx bx-home'></i>
      <span>Home</span>
    </a>
    <a href="#" class="nav-item">
      <i class='bx bx-heart'></i>
      <span>Saved</span>
    </a>
    <a href="cart.html" class="nav-item active">
      <i class='bx bx-shopping-bag'></i>
      <span>Cart</span>
    </a>
    <a href="#" class="nav-item">
      <i class='bx bx-user'></i>
      <span>Profile</span>
    </a>
  </nav>

  <script>
    let cart = JSON.parse(localStorage.getItem("campusCart")) || [];

    function formatPrice(price) {
      return Number(price).toLocaleString("en-US");
    }

    function updateCart() {
      localStorage.setItem("campusCart", JSON.stringify(cart));
      renderCart();
    }

    function renderCart() {
      const emptyCart = document.getElementById("emptyCart");
      const cartContent = document.getElementById("cartContent");
      const cartItemsList = document.getElementById("cartItemsList");

      if (cart.length === 0) {
        emptyCart.style.display = "block";
        cartContent.style.display = "none";
        return;
      }

      emptyCart.style.display = "none";
      cartContent.style.display = "block";

      cartItemsList.innerHTML = "";
      let subtotal = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.price * (item.quantity || 1);
        subtotal += itemTotal;

        const itemHTML = `\
          <div class="cart-item">\
            <div class="item-details">\
              <div class="item-name">${item.name}</div>\
              <div class="item-price">UGX ${formatPrice(item.price)}</div>\
              <div class="quantity-controls">\
                <button class="qty-btn" onclick="decrementQty(${index})">−</button>\
                <span class="quantity">${item.quantity || 1}</span>\
                <button class="qty-btn" onclick="incrementQty(${index})">+</button>\
                <span class="item-total">= UGX ${formatPrice(itemTotal)}</span>\
              </div>\
            </div>\
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>\
          </div>\
        `;
        cartItemsList.innerHTML += itemHTML;
      });

      // Update summary
      const deliveryFee = 0; // Free delivery for now
      const total = subtotal + deliveryFee;

      document.getElementById("subtotal").textContent = `UGX ${formatPrice(subtotal)}`;
      document.getElementById("deliveryFee").textContent = `UGX ${formatPrice(deliveryFee)}`;
      document.getElementById("totalPrice").textContent = `UGX ${formatPrice(total)}`;
    }

    function incrementQty(index) {
      cart[index].quantity = (cart[index].quantity || 1) + 1;
      updateCart();
    }

    function decrementQty(index) {
      if (cart[index].quantity > 1) {
        cart[index].quantity--;
        updateCart();
      }
    }

    function removeItem(index) {
      if (confirm("Remove this item from cart?")) {
        cart.splice(index, 1);
        updateCart();
      }
    }

    function goHome() {
      window.location.href = "index.html";
    }

    function sendOrderToWhatsApp() {
      if (cart.length === 0) {
        alert("Your cart is empty!");
        return;
      }

      let message = "Hello Campus Express! I'd like to place this order:\n\n";
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * (item.quantity || 1);
        message += `• ${item.name} × ${item.quantity || 1} = UGX ${formatPrice(itemTotal)}\n`;
        total += itemTotal;
      });

      message += `\nTotal: UGX ${formatPrice(total)}\n`;
      message += "Delivery to: [Your hostel/room]\nPayment: [Cash/Mobile Money]\nThank you!";

      const phoneNumber = "256760931135";
      const waUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;

      window.open(waUrl, "_blank");
    }

    // Initial render
    renderCart();
  </script>

</body>
</html>
